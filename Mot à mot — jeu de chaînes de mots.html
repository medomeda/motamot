<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mot à mot — le jeu des chaînes de mots</title>
<style>
:root{--bg:#faf6ee;--card:#fff;--ink:#2a2520;--mut:#7a7066;--a:#d9531e;--b:#1f6f8b;--ok:#2e8b57;--bad:#c0392b;--line:#e6dccb}
@media(prefers-color-scheme:dark){:root{--bg:#1d1a17;--card:#292420;--ink:#f3ece1;--mut:#a89d90;--line:#40382f}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,sans-serif}
.wrap{max-width:520px;margin:0 auto;padding:16px}
h1{font-size:26px;margin:4px 0 2px}.sub{color:var(--mut);margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 4px}
input[type=text]{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:16px;background:var(--bg);color:var(--ink)}
.seg{display:flex;gap:6px}.seg button{flex:1}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:11px 12px}
button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button.go{background:var(--a);color:#fff;border-color:var(--a);font-weight:700;width:100%;padding:14px;font-size:17px;margin-top:6px}
.goal{display:flex;align-items:center;justify-content:center;gap:10px;font-size:22px;font-weight:800;text-transform:uppercase;letter-spacing:1px}
.goal span.arr{color:var(--mut)}
.turn{text-align:center;font-weight:700;padding:8px;border-radius:10px;color:#fff;margin:0 0 10px}
.tiles{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin:10px 0}
.tile{width:48px;height:56px;font-size:26px;font-weight:800;text-transform:uppercase;padding:0;border:2px solid var(--ink);border-radius:10px}
.score{display:flex;gap:8px;margin-bottom:10px}.sc{flex:1;border:2px solid;border-radius:12px;padding:6px 10px;background:var(--card);display:flex;align-items:baseline;gap:6px;opacity:.65}.sc.act{opacity:1;box-shadow:0 0 0 3px rgba(217,83,30,.18)}.sc span{flex:1;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.sc b{font-size:22px}.sc small{color:var(--mut)}.tile.sel{background:var(--a);color:#fff;border-color:var(--a)}
.tile:active{background:var(--bad);color:#fff}
.hint{text-align:center;color:var(--mut);font-size:13px;margin:0 0 8px}
.chain{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:14px}
.chip{padding:3px 8px;border-radius:8px;color:#fff;text-transform:uppercase;font-weight:700;font-size:12px}
.letters{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:8px}
.letters button{padding:9px 0;text-transform:uppercase;font-weight:700}
.pos{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.pos button{text-transform:uppercase;font-weight:700;letter-spacing:2px}
.pos b{color:var(--a)}
.msg{min-height:22px;text-align:center;font-size:14px;color:var(--bad);margin:4px 0}
.row{display:flex;gap:8px}.row button{flex:1}
.win{text-align:center}.win h2{font-size:28px;margin:6px 0}
.small{font-size:13px;color:var(--mut)}
</style></head><body><div class="wrap" id="app"></div>

let SUB=true;function setSub(v){SUB=v;}
function makeDict(str){return new Set(str.split(' '));}
function neighbors(w,D){const r=[];
 for(let i=0;i<w.length;i++)for(const c of ALPHA){if(c===w[i])continue;const x=w.slice(0,i)+c+w.slice(i+1);if(D.has(x))r.push(x);}

 if(SUB&&a.length===b.length){let d=0;for(let i=0;i<a.length;i++)if(a[i]!==b[i])d++;if(d===1)return 'rep';} // 'add' | 'del' | null
 if(b.length===a.length+1){for(let i=0;i<b.length;i++)if(b.slice(0,i)+b.slice(i+1)===a)return 'add';}
 if(b.length===a.length-1){for(let i=0;i<a.length;i++)if(a.slice(0,i)+a.slice(i+1)===b)return 'del';}
 return null;}
function aiMove(cur,target,used,D,dist,level){
 const c=neighbors(cur,D).filter(w=>!used.has(w));
 if(!c.length)return null;
 if(c.includes(target))return target;
 const dd=w=>dist.has(w)?dist.get(w):99;
 const rnd=a=>a[Math.floor(Math.random()*a.length)];
 if(level==='easy'){ // naïve : se rapproche sans voir le piège
   if(Math.random()<0.25)return rnd(c);
   const m=Math.min(...c.map(dd));return rnd(c.filter(w=>dd(w)===m));}
 const safe=c.filter(w=>dd(w)>=2);
 const pool=safe.length?safe:c;
 if(level==='mid'){const m=Math.min(...pool.map(dd));
   return Math.random()<0.7?rnd(pool.filter(w=>dd(w)===m)):rnd(pool);}
 const score=w=>{const u2=new Set(used);u2.add(w);
   const rep=neighbors(w,D).filter(x=>!u2.has(x)&&x!==target);
   return rep.filter(x=>dd(x)>=2).length*10+Math.random()*3;};
 let best=null,bs=1e9;for(const w of pool){const s=score(w);if(s<bs){bs=s;best=w;}}
 return best;}
function pickChallenge(common,D,steps,tries){
 const cs=new Set(common);
 for(let k=0;k<(tries||60);k++){
  const s=common[Math.floor(Math.random()*common.length)];
  const d=new Map([[s,0]]);const q=[s];let found=[];
  for(let h=0;h<q.length;h++){const u=q[h],du=d.get(u);if(du>=steps)continue;
   for(const v of neighbors(u,D))if(!d.has(v)){d.set(v,du+1);q.push(v);if(du+1===steps&&cs.has(v)&&!v.includes(s)&&!s.includes(v))found.push(v);}}
  if(found.length)return [s,found[Math.floor(Math.random()*found.length)]];}
 return null;}

const D=makeDict(WORDS);
let distCache=new Map();
const COL=['#d9531e','#1f6f8b'];
const S={screen:'setup',mode:'ai',level:'mid',names:['Joueur 1','Joueur 2'],diff:'easy',wmode:'rand',len:4,start:'',target:'',cur:'',used:null,chain:[],turn:0,moves:[0,0],sel:null,msg:'',pick:null,help:false,over:null,cs:'',ct:''};
const $=id=>document.getElementById(id);
const rnd=a=>a[Math.floor(Math.random()*a.length)];
function dist(){const k=S.target;if(!distCache.has(k))distCache.set(k,bfs(S.target,D));return distCache.get(k);}
function nameOf(i){return S.mode==='ai'&&i===1?'Ordinateur':S.names[i];}
function esc(x){return String(x).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function render(){const a=$('app');
 if(S.screen==='setup'){a.innerHTML=`
 <h1>Mot à mot</h1><p class="sub">Passez d'un mot à un autre en remplaçant une seule lettre à la fois (le même nombre de lettres à chaque étape). Chaque étape doit être un vrai mot. Celui qui atteint le mot objectif gagne !</p>
 <div class="card"><label>Mode</label><div class="seg"><button id="m1" class="${S.mode==='ai'?'on':''}">Contre l'ordinateur</button><button id="m2" class="${S.mode==='two'?'on':''}">2 joueurs</button></div>
 ${S.mode==='ai'?`<label>Niveau de l'ordinateur</label><div class="seg"><button data-l="easy" class="lv ${S.level==='easy'?'on':''}">Facile</button><button data-l="mid" class="lv ${S.level==='mid'?'on':''}">Moyen</button><button data-l="hard" class="lv ${S.level==='hard'?'on':''}">Malin</button></div>`:''}
 <label>${S.mode==='ai'?'Ton prénom':'Prénoms'}</label><div class="row"><input type="text" id="n1" value="${esc(S.names[0])}" maxlength="12">${S.mode==='two'?`<input type="text" id="n2" value="${esc(S.names[1])}" maxlength="12">`:''}</div>
 <label>Choix des mots</label><div class="seg"><button id="w1" class="${S.wmode==='rand'?'on':''}">🎲 Aléatoires</button><button id="w2" class="${S.wmode==='own'?'on':''}">✍️ Je les choisis</button></div>
 ${S.wmode==='rand'?`<label>Distance entre les mots (toujours réalisable)</label><div class="seg"><button data-d="easy" class="df ${S.diff==='easy'?'on':''}">3 étapes</button><button data-d="mid" class="df ${S.diff==='mid'?'on':''}">4 étapes</button><button data-d="hard" class="df ${S.diff==='hard'?'on':''}">5 étapes</button></div>`:`<label>Mot de départ et mot objectif</label><div class="row"><input type="text" id="cs" placeholder="ex : chat" value="${esc(S.cs)}"><input type="text" id="ct" placeholder="ex : lion" value="${esc(S.ct)}"></div>`}
 ${S.wmode==='rand'?`<label>Nombre de lettres</label><div class="seg">${[3,4,5,6].map(n=>`<button data-n="${n}" class="ln ${S.len===n?'on':''}">${n}</button>`).join('')}</div>`:''}
 <div class="msg" id="smsg">${S.msg}</div>
 <button class="go" id="play">Jouer</button></div>
 <p class="small">Exemple : CHAT → CHAR → CHER → … Règle : un mot déjà utilisé ne peut pas être rejoué. Si tu ne peux plus jouer, tu perds. Attention : arriver à un mot à une lettre de l'objectif offre la victoire à l'adversaire !</p>`;
  $('m1').onclick=()=>{rd();S.mode='ai';render()};$('m2').onclick=()=>{rd();S.mode='two';render()};
  document.querySelectorAll('.lv').forEach(b=>b.onclick=()=>{rd();S.level=b.dataset.l;render()});
  $('w1').onclick=()=>{rd();S.wmode='rand';S.msg='';render()};$('w2').onclick=()=>{rd();S.wmode='own';S.msg='';render()};
  document.querySelectorAll('.ln').forEach(b=>b.onclick=()=>{rd();S.len=+b.dataset.n;render()});
  document.querySelectorAll('.df').forEach(b=>b.onclick=()=>{rd();S.diff=b.dataset.d;render()});
  $('play').onclick=()=>{rd();startGame()};return;}
 if(S.screen==='game'||S.screen==='over'){
  const over=S.screen==='over',cur=S.turn;
  const d=dist().get(S.cur);
  a.innerHTML=`<div class="card"><div class="goal"><span>${esc(S.start)}</span><span class="arr">→</span><span style="color:var(--a)">${esc(S.target)}</span></div></div>
  ${over?`<div class="card win"><div style="font-size:48px">${S.over.draw?'🤝':'🏆'}</div><h2>${S.over.draw?'Match nul':esc(nameOf(S.over.w))+' gagne !'}</h2><p>${esc(S.over.why)}</p><p class="small">Coups joués : ${esc(nameOf(0))} ${S.moves[0]} · ${esc(nameOf(1))} ${S.moves[1]}</p><button class="go" id="again">Rejouer</button><button id="menu" style="width:100%;margin-top:8px">Menu</button></div>`:
  `<div class="turn" style="background:${COL[cur]}">Tour de ${esc(nameOf(cur))}</div>`}
  <div class="score">${[0,1].map(i=>`<div class="sc ${!over&&S.turn===i?'act':''}" style="border-color:${COL[i]}"><span>${esc(nameOf(i))}</span><b>${S.moves[i]}</b><small>coup${S.moves[i]>1?'s':''}</small></div>`).join('')}</div>
  <div class="card"><div class="tiles">${[...S.cur].map((c,i)=>`<button class="tile ${S.sel===i?'sel':''}" data-i="${i}" ${over||aiTurn()?'disabled':''}>${c}</button>`).join('')}</div>
  ${over?'':`<p class="hint">${S.sel===null?'Touche la lettre à remplacer.':'Remplace « '+S.cur[S.sel].toUpperCase()+' » par :'}</p>
  ${S.sel!==null?`<div class="letters">${ALPHA.split('').filter(c=>c!==S.cur[S.sel]).map(c=>`<button data-r="${c}">${c}</button>`).join('')}</div>`:''}
  <div class="row" style="margin-top:8px"><button id="aid">${S.help?'Cacher l\'aide':'Aide'}</button></div>
  ${S.help?`<p class="hint" style="margin-top:8px">${d===undefined?'Ce mot est trop loin de l\'objectif.':d===0?'':`À ${d} étape${d>1?'s':''} de l'objectif.`}</p>`:''}
  <div class="msg">${S.msg}</div>
  <button id="quit" class="small" style="width:100%;border-style:dashed">${aiTurn()?'':'Je suis bloqué(e) / j\'abandonne'}</button>`}</div>
  <div class="card"><div class="small" style="margin-bottom:6px">Chaîne de mots</div><div class="chain">${S.chain.map((c,i)=>`${i?'<span class="small">›</span>':''}<span class="chip" style="background:${c.p<0?'#888':COL[c.p]}">${esc(c.w)}</span>`).join('')}</div></div>`;
  if(over){$('again').onclick=()=>startGame(true);$('menu').onclick=()=>{S.screen='setup';S.msg='';render()};return;}
  document.querySelectorAll('.tile').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;S.sel=S.sel===i?null:i;S.msg='';render();});
  document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>play(S.cur.slice(0,S.sel)+b.dataset.r+S.cur.slice(S.sel+1)));
  $('aid').onclick=()=>{S.help=!S.help;render()};
  $('quit').onclick=()=>{if(!aiTurn())end(1-S.turn,nameOf(S.turn)+' abandonne ou est bloqué(e).')};
 }}
function rd(){const n1=$('n1'),n2=$('n2'),cs=$('cs'),ct=$('ct');if(n1)S.names[0]=n1.value.trim()||'Joueur 1';if(n2)S.names[1]=n2.value.trim()||'Joueur 2';if(cs){S.cs=cs.value.trim().toLowerCase();S.ct=ct.value.trim().toLowerCase();}}
function aiTurn(){return S.mode==='ai'&&S.turn===1&&S.screen==='game';}
function startGame(again){
 if(S.wmode==='own'){
  if(!again){const s=norm(S.cs),t=norm(S.ct);
   if(!s||!t||s===t){S.msg='Écris deux mots différents.';render();return;}
   if(s.length!==t.length){S.msg='Les deux mots doivent avoir le même nombre de lettres.';render();return;}
   if(!D.has(s)||!D.has(t)){S.msg='« '+(!D.has(s)?s:t).toUpperCase()+' » est introuvable dans le dictionnaire.';render();return;}
   const n=bfs(t,D).get(s);
   if(n===undefined){S.msg='Ces deux mots ne sont pas reliés : aucune solution possible.';render();return;}
   S.start=s;S.target=t;}
 }else{
  $('app').innerHTML='<p class="sub" style="text-align:center;margin-top:40vh">Recherche d\'un défi réalisable…</p>';
  setTimeout(()=>{const cm=COMMON.filter(w=>w.length===S.len);let st={easy:3,mid:4,hard:5}[S.diff],p=null;while(!p&&st>=1){p=pickChallenge(cm,D,st,80);if(!p)st--;}S.start=p[0];S.target=p[1];launch();},30);return;}
 launch();}
function launch(){
 S.cur=S.start;S.used=new Set([S.start]);S.chain=[{w:S.start,p:-1}];S.turn=0;S.moves=[0,0];S.sel=null;S.msg='';S.pick=null;S.help=false;S.over=null;S.screen='game';render();}
function norm(x){return x.normalize('NFD').replace(/[̀-ͯ]/g,'');}
function play(w){
 S.pick=null;S.sel=null;
 if(w.length<2){S.msg='Trop court !';render();return;}
 if(!D.has(w)){S.msg=`« ${w.toUpperCase()} » n'est pas dans mon dictionnaire.`;render();return;}
 if(S.used.has(w)){S.msg=`« ${w.toUpperCase()} » a déjà été joué.`;render();return;}
 commit(w);}
function commit(w){
 S.msg='';S.used.add(w);S.chain.push({w,p:S.turn});S.moves[S.turn]++;S.cur=w;
 if(w===S.target){end(S.turn,`${nameOf(S.turn)} atteint « ${S.target.toUpperCase()} » en ${S.chain.length-1} coups.`);return;}
 S.turn=1-S.turn;
 if(!neighbors(w,D).some(x=>!S.used.has(x))){S.screen='over';S.over={w:1-S.turn,why:`${nameOf(S.turn)} est bloqué(e) : plus aucun mot possible.`};render();return;}
 render();
 if(aiTurn()){setTimeout(()=>{const m=aiMove(S.cur,S.target,S.used,D,dist(),S.level);if(!m)end(0,'L\'ordinateur est bloqué.');else commit(m);},900);}}
function end(w,why){S.screen='over';S.over={w,why};render();}
render();
</script></body></html>
